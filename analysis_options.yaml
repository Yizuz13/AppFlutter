# Reglas de análisis estático para el proyecto Gestor de Tareas Académicas
# Configuración en Flutter puro sin requerir paquetes externos
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    - avoid_print
    - use_key_in_widget_constructors
    - unnecessary_this
    - prefer_final_fields
